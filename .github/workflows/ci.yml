name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # The app uses iOS 27 APIs (the Duo split), so it needs the iOS 27 SDK.
      - name: Select Xcode 27
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # No pipe to a formatter. This used to pipe xcodebuild into xcpretty without
      # pipefail, so it stayed green while package resolution failed on the pinned
      # Xcode 16 and no test ran. The simulator is resolved, since a pinned device
      # name rots whenever the runner image changes.
      - name: Test
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for runtime in sorted(devices, reverse=True):
              for device in devices[runtime]:
                  if device.get('isAvailable') and device['name'].startswith('iPhone'):
                      print(device['udid'])
                      raise SystemExit
          raise SystemExit('no available iPhone simulator on this runner')
          ")
          xcodebuild test \
            -project Bond.xcodeproj \
            -scheme Bond \
            -destination "id=$UDID" \
            -only-testing:BondTests \
            CODE_SIGNING_ALLOWED=NO

  lint:
    name: SwiftLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SwiftLint
        uses: norio-nomura/action-swiftlint@3.2.1
